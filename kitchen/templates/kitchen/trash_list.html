<!DOCTYPE html>
<html>
<head>
<title>Trash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui; background: linear-gradient(135deg, #fef3c7, #fed7aa); min-height: 100vh; padding: 30px; color: #1f2937; }
  .container { max-width: 1000px; margin: 0 auto; }
  .back { color: #78350f; text-decoration: none; font-size: 14px; }
  .back:hover { text-decoration: underline; }
  h1 { color: #9a3412; margin: 16px 0 24px; }
  .note { font-size: 14px; color: #78716c; font-weight: normal; }
  table { width: 100%; background: white; border-radius: 12px; border-collapse: collapse; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid #fcd34d; }
  th { background: #fef3c7; color: #78350f; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }
  tr:last-child td { border-bottom: 0; }
  .btn { padding: 8px 14px; border-radius: 6px; border: 0; cursor: pointer; text-decoration: none; font-size: 13px; font-weight: 600; color: white; display: inline-block; margin-right: 6px; }
  .btn-success { background: #10b981; }
  .btn-danger { background: #dc2626; }
  .empty { text-align: center; padding: 40px; color: #a8a29e; }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="{% url 'kitchen:recipe_list' %}">← Back to recipes</a>
  <h1>🗑 Trash <span class="note">(auto-deletes after 24h)</span></h1>
  <table>
    <thead>
      <tr><th>Name</th><th>Cuisine</th><th>Deleted at</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for r in recipes %}
        <tr>
          <td>{{ r.name }}</td>
          <td>{{ r.cuisine }}</td>
          <td>{{ r.deleted_at|date:"M d, Y H:i" }}</td>
          <td>
            <a class="btn btn-success" href="{% url 'kitchen:recipe_restore' r.pk %}">Restore</a>
            <a class="btn btn-danger" href="{% url 'kitchen:recipe_hard_delete' r.pk %}">Delete forever</a>
          </td>
        </tr>
      {% empty %}
        <tr><td class="empty" colspan="4">Trash is empty.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
